# Verification steps: scripts/check-go.sh, scripts/check-web.sh
# Web matrix restores node_modules from web-deps (no per-job npm ci).
name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".cursor/**"
      - ".codegraph/**"
      - "assets/**"
      - "LICENSE"
      - ".env.example"

jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check (Go lint)
        run: ./scripts/check-go.sh --lint-only --verbose

  go-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [core, tasks, handlertest, handlertest-ui, task-bcs, agents, harness]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check (Go tests — ${{ matrix.group }})
        run: ./scripts/check-go.sh --tests-only --group=${{ matrix.group }} --verbose

  web-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache web node_modules
        id: nm
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: web-node-modules-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install web deps
        if: steps.nm.outputs.cache-hit != 'true'
        run: ./scripts/check-web.sh --install-only --verbose

  web:
    needs: web-deps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group:
          [
            lint,
            build,
            test-unit,
            test-components,
            test-task-components,
            test-task-hooks,
            test-app,
            test-task-pages,
            test-task-create,
            test-settings,
            test-projects,
            test-worktrees,
          ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore web node_modules
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: web-node-modules-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          fail-on-cache-miss: true

      - name: Check (web - ${{ matrix.group }})
        run: ./scripts/check-web.sh --verbose --group=${{ matrix.group }}
